<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Larissa, 23</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111418;
      --card-radius: 12px;
      --accent: #fd267a;
      --accent-2: #ff6036;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      background:
        radial-gradient(120% 80% at 50% -10%, #2a2f38 0%, transparent 55%),
        linear-gradient(180deg, #1a1e24 0%, #0d0f12 100%);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 20px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .phone {
      width: min(100%, 390px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .logo {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-icons {
      display: flex;
      gap: 18px;
      color: #6b7280;
    }

    .nav-icons svg {
      width: 26px;
      height: 26px;
    }

    .card {
      position: relative;
      aspect-ratio: 3 / 4.15;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.45),
        0 2px 0 rgba(255, 255, 255, 0.04) inset;
      background: #222;
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      user-select: none;
      touch-action: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(28px) rotate(-1.5deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0);
      }
    }

    .card img.photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    .photo-dots {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 3;
    }

    .photo-dots span {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
    }

    .photo-dots span.active {
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .fade {
      position: absolute;
      inset: auto 0 0 0;
      height: 48%;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.88) 0%,
        rgba(0, 0, 0, 0.55) 42%,
        rgba(0, 0, 0, 0) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .info {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 22px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeUp 0.6s ease 0.35s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .name {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
      line-height: 1.1;
    }

    .age {
      font-size: 1.55rem;
      font-weight: 600;
      opacity: 0.96;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .verified {
      width: 22px;
      height: 22px;
      margin-left: 2px;
      flex-shrink: 0;
      align-self: center;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
    }

    .distance {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    .distance svg {
      width: 15px;
      height: 15px;
      opacity: 0.95;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 2px;
      animation: fadeUp 0.55s ease 0.5s both;
    }

    .btn {
      border: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: #1c2128;
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-sm {
      width: 48px;
      height: 48px;
    }

    .btn-lg {
      width: 62px;
      height: 62px;
    }

    .btn svg {
      width: 26px;
      height: 26px;
    }

    .btn-lg svg {
      width: 30px;
      height: 30px;
    }

    .btn-pass svg { stroke: #fd5068; fill: none; }
    .btn-super svg { fill: #2db3ff; stroke: none; }
    .btn-like svg { fill: #1be4a1; stroke: none; }
    .btn-boost svg { fill: #a855f7; stroke: none; }
    .btn-rewind svg { stroke: #f5b942; fill: none; }

    .stamp {
      position: absolute;
      top: 18%;
      z-index: 4;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border: 5px solid;
      border-radius: 8px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transform: rotate(-18deg) scale(1.1);
      transition: opacity 0.2s ease;
    }

    .stamp.like {
      left: 18px;
      color: #1be4a1;
      border-color: #1be4a1;
    }

    .stamp.nope {
      right: 18px;
      color: #fd5068;
      border-color: #fd5068;
      transform: rotate(18deg) scale(1.1);
    }

    .stamp.show {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="top-nav" aria-label="Navegação">
      <div class="logo">tinder</div>
      <div class="nav-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10z" />
        </svg>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
      </div>
    </header>

    <article class="card" id="card" aria-label="Perfil de Larissa, 23 anos">
      <div class="photo-dots" aria-hidden="true">
        <span class="active"></span>
        <span></span>
        <span></span>
      </div>
      <img class="photo" src="larissa.jpg" alt="Foto de Larissa" />
      <div class="fade" aria-hidden="true"></div>
      <div class="info">
        <div class="name-row">
          <h1 class="name">Larissa</h1>
          <span class="age">23</span>
          <svg class="verified" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="11" fill="#2db3ff" />
            <path d="M7.5 12.2l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="distance">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" />
          </svg>
          1 km de distância
        </p>
      </div>
      <div class="stamp like" id="stamp-like">LIKE</div>
      <div class="stamp nope" id="stamp-nope">NOPE</div>
    </article>

    <nav class="actions" aria-label="Ações">
      <button class="btn btn-sm btn-rewind" type="button" aria-label="Desfazer" title="Desfazer">
        <svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14L4 9l5-5" />
          <path d="M4 9h10a6 6 0 1 1 0 12h-3" />
        </svg>
      </button>
      <button class="btn btn-lg btn-pass" type="button" aria-label="Passar" id="btn-pass">
        <svg viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <button class="btn btn-sm btn-super" type="button" aria-label="Super Like">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.8 6 21l1.3-6.7-5-4.7 6.8-.8L12 2.5z" />
        </svg>
      </button>
      <button class="btn btn-lg btn-like" type="button" aria-label="Curtir" id="btn-like">
        <svg viewBox="0 0 24 24">
          <path d="M12 21s-7.2-4.6-9.4-9.1C1.2 9 2.4 5.8 5.4 4.7c2-.7 4.1.1 5.3 1.8 1.2-1.7 3.3-2.5 5.3-1.8 3 1.1 4.2 4.3 2.8 7.2C19.2 16.4 12 21 12 21z" />
        </svg>
      </button>
      <button class="btn btn-sm btn-boost" type="button" aria-label="Boost">
        <svg viewBox="0 0 24 24">
          <path d="M13 2L4 14h7l-1 8 10-14h-7l0-6z" />
        </svg>
      </button>
    </nav>
  </div>

  <script>
    const card = document.getElementById("card");
    const stampLike = document.getElementById("stamp-like");
    const stampNope = document.getElementById("stamp-nope");
    let startX = 0;
    let currentX = 0;
    let dragging = false;

    function resetCard() {
      card.style.transition = "transform 0.35s cubic-bezier(0.22,1,0.36,1)";
      card.style.transform = "";
      stampLike.classList.remove("show");
      stampNope.classList.remove("show");
    }

    function fly(dir) {
      card.style.transition = "transform 0.4s ease, opacity 0.4s ease";
      card.style.transform = `translateX(${dir * 480}px) rotate(${dir * 18}deg)`;
      card.style.opacity = "0";
      setTimeout(() => {
        card.style.transition = "none";
        card.style.transform = "";
        card.style.opacity = "1";
        stampLike.classList.remove("show");
        stampNope.classList.remove("show");
        requestAnimationFrame(() => {
          card.style.transition = "transform 0.35s cubic-bezier(0.22,1,0.36,1)";
        });
      }, 420);
    }

    document.getElementById("btn-like").addEventListener("click", () => {
      stampLike.classList.add("show");
      fly(1);
    });

    document.getElementById("btn-pass").addEventListener("click", () => {
      stampNope.classList.add("show");
      fly(-1);
    });

    card.addEventListener("pointerdown", (e) => {
      dragging = true;
      startX = e.clientX;
      currentX = 0;
      card.setPointerCapture(e.pointerId);
      card.style.transition = "none";
    });

    card.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      currentX = e.clientX - startX;
      const rot = currentX / 28;
      card.style.transform = `translateX(${currentX}px) rotate(${rot}deg)`;
      stampLike.classList.toggle("show", currentX > 60);
      stampNope.classList.toggle("show", currentX < -60);
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      if (currentX > 120) {
        stampLike.classList.add("show");
        fly(1);
      } else if (currentX < -120) {
        stampNope.classList.add("show");
        fly(-1);
      } else {
        resetCard();
      }
    }

    card.addEventListener("pointerup", endDrag);
    card.addEventListener("pointercancel", endDrag);
  </script>
</body>
</html>
